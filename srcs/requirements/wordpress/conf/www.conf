; /etc/php/8.2/fpm/pool.d/www.conf
; php-fpm pool configuration for WordPress

[www]
user  = www-data
group = www-data

; Listen on TCP so NGINX (in another container) can reach us
listen = 0.0.0.0:9000

; Dynamic process management
pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pass environment variables from Docker into php-fpm workers
clear_env = no
