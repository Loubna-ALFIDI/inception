# Dropped into /etc/nginx/conf.d/default.conf
# The container's default /etc/nginx/nginx.conf already includes conf.d/*.conf

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ${DOMAIN_NAME};
    root        /var/www/html;
    index       index.php index.html;

    # ── TLS certificate (self-signed, generated at build time) ────────────────
    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Strictly allow only TLSv1.2 and TLSv1.3 (no SSLv3, TLSv1.0, TLSv1.1)
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── Static files ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ── PHP – proxy to WordPress/php-fpm container ────────────────────────────
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   wordpress:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
    }

    # Deny access to hidden files (.htaccess, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
